<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #fff; }
      body.shot { overflow: hidden; }
      .frame { display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <div id="frame" class="frame"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "/brand/tsef-logo-official.svg";
      const w = Number(params.get("w") || 1200);
      const h = Number(params.get("h") || 630);
      const pad = Number(params.get("pad") || 0);
      document.body.classList.add("shot");
      const frame = document.getElementById("frame");
      frame.style.width = w + "px";
      frame.style.height = h + "px";
      const img = document.createElement("img");
      img.src = src;
      img.style.maxWidth = w - pad * 2 + "px";
      img.style.maxHeight = h - pad * 2 + "px";
      img.style.objectFit = "contain";
      frame.appendChild(img);
    </script>
  </body>
</html>
